name: Build and test
on:
  push:
    branches:
      - main
      - master
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: Ubuntu / ${{ matrix.build-system }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build-system: [cmake, autotools]
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential cmake libnetcdf-dev netcdf-bin
      - name: Report dependency versions
        run: |
          gcc --version
          cmake --version
          nc-config --all
          h5cc -showconfig
      - name: Build, test, and install with CMake
        if: matrix.build-system == 'cmake'
        run: |
          cmake -S . -B build/cmake \
            -DBUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/nccmp-install"
          cmake --build build/cmake --parallel 2
          ctest --test-dir build/cmake --output-on-failure \
            --no-tests=error --exclude-regex '^test_big$'
          cmake --install build/cmake
      - name: Build, test, and install with Autotools
        if: matrix.build-system == 'autotools'
        run: |
          mkdir -p build/autotools
          cd build/autotools
          ../../configure --prefix="$RUNNER_TEMP/nccmp-install"
          make -j2
          make check || { cat test/test-suite.log; exit 1; }
          make install
      - name: Check installed executable
        run: '"$RUNNER_TEMP/nccmp-install/bin/nccmp" --version'
