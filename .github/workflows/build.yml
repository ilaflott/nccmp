name: Build and test
on:
  push:
    branches:
      - main
      - master
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: Ubuntu / ${{ matrix.build-system }} / libnetcdf ${{ matrix.netcdf-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        build-system: [cmake, autotools]
        netcdf-version: ["4.9.2", "4.9.3", "4.10.0", "4.10.1"]
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential cmake
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
        with:
          activate-environment: test
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install libnetcdf
        run: |
          conda install --yes "libnetcdf=${{ matrix.netcdf-version }}" "hdf5=1.14.*"
          echo "NETCDF_PREFIX=$CONDA_PREFIX" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Report dependency versions
        run: |
          gcc --version
          cmake --version
          nc-config --all
          h5cc -showconfig
      - name: Build, test, and install with CMake
        if: matrix.build-system == 'cmake'
        run: |
          cmake -S . -B build/cmake \
            -DBUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DNETCDF_INC_DIR="$NETCDF_PREFIX/include" \
            -DNETCDF_LIB_PATH="$NETCDF_PREFIX/lib/libnetcdf.so" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$NETCDF_PREFIX/lib" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/nccmp-install"
          cmake --build build/cmake --parallel 2
          ctest --test-dir build/cmake --output-on-failure \
            --no-tests=error --exclude-regex '^test_big$'
          cmake --install build/cmake
      - name: Build, test, and install with Autotools
        if: matrix.build-system == 'autotools'
        run: |
          autoreconf -fi
          mkdir -p build/autotools
          cd build/autotools
          CPPFLAGS="-I$NETCDF_PREFIX/include" \
            LDFLAGS="-L$NETCDF_PREFIX/lib" \
            ../../configure --prefix="$RUNNER_TEMP/nccmp-install"
          make -j2
          make check || { cat test/test-suite.log; exit 1; }
          make install
      - name: Check installed executable
        run: '"$RUNNER_TEMP/nccmp-install/bin/nccmp" --version'
